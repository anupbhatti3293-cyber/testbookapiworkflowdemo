apiVersion: apps/v1
kind: Deployment
metadata:
  name: testbook-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: testbook-api
  template:
    metadata:
      labels:
        app: testbook-api
    spec:
      containers:
        - name: testbook-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
